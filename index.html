<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111113"><title>Career Hub</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5e7;--accent:#0071e3;--soft:#e8f2ff;--green:#248a3d;--danger:#c93434;--shadow:0 10px 35px rgba(0,0,0,.06)}
[data-theme=dark]{--bg:#101012;--panel:#1b1b1f;--text:#f5f5f7;--muted:#a1a1a6;--line:#303035;--accent:#2997ff;--soft:#16283a;--green:#49b963;--danger:#ff6961;--shadow:0 10px 35px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;z-index:10}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 25px}.logo{width:40px;height:40px;border-radius:12px;background:var(--text);color:var(--panel);display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand small{color:var(--muted)}nav{display:grid;gap:4px}.nav{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left}.nav.active,.nav:hover{background:var(--bg);color:var(--text)}.sideFoot{position:absolute;bottom:20px;left:24px;color:var(--muted);font-size:12px}.main{margin-left:250px;min-height:100vh}.top{height:70px;position:sticky;top:0;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;padding:0 30px;z-index:5}.top button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:20px;padding:9px 13px}.content{max-width:1200px;margin:auto;padding:45px 30px 90px}.title{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--muted)}h1{font-size:46px;letter-spacing:-.05em;line-height:1;margin:8px 0 12px}h2{font-size:19px;margin:0 0 5px}h3{font-size:15px;margin:0 0 5px}p{color:var(--muted);line-height:1.55;margin:0}.btn{border:0;border-radius:22px;padding:11px 16px;background:var(--text);color:var(--panel);font-weight:650}.btn.alt{background:var(--panel);color:var(--text);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.stat{display:flex;gap:13px}.ico{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800}.stat strong{display:block;font-size:25px;margin-top:2px}.stat small{color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.cardHead{display:flex;justify-content:space-between;margin-bottom:20px}.link{border:0;background:none;color:var(--accent)}.bar{height:8px;border-radius:20px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.grow{flex:1}.row small,.muted{color:var(--muted)}.pill{font-size:11px;font-weight:700;padding:5px 9px;border-radius:20px;background:var(--bg);color:var(--muted)}.pill.active,.pill.offer{background:#e7f6eb;color:var(--green)}.pill.applied{background:var(--soft);color:var(--accent)}.pill.interview,.pill.expiring{background:#fff0d9;color:#9a5a00}.toolbar{display:flex;gap:10px;margin-bottom:14px}.search{height:42px;max-width:400px;flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 13px;color:var(--text);outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid.four{grid-template-columns:repeat(4,1fr)}.resume{height:170px;background:var(--bg);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;margin-bottom:14px}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.job{border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:12px}.job span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.modalBg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:30;padding:20px}.modal{width:min(460px,100%);background:var(--panel);border-radius:24px;padding:25px;position:relative}.modal input,.modal select{width:100%;padding:11px 12px;margin:7px 0 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);outline:0}.close{position:absolute;right:14px;top:12px;border:0;background:none;color:var(--muted);font-size:22px}.mobile{display:none}
@media(max-width:900px){.side{display:none}.main{margin-left:0}.top{justify-content:flex-end;padding:0 18px}.content{padding:32px 18px 95px}.stats{grid-template-columns:repeat(2,1fr)}.two,.kanban{grid-template-columns:1fr}.grid.four{grid-template-columns:repeat(2,1fr)}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;height:65px;background:var(--panel);border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:20}.mobile button{border:0;background:none;color:var(--muted);font-size:10px}.mobile button.active{color:var(--text);font-weight:700}}
@media(max-width:600px){h1{font-size:36px}.title{align-items:flex-start;flex-direction:column}.grid,.grid.four{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:15px}.stat strong{font-size:21px}}
</style></head>
<body><div id="app"></div><div id="modal"></div>
<script>
const NAV=['Dashboard','Certifications','Resumes','Applications','Skills','Goals','Documents','Settings'];
const icons={Dashboard:'⌂',Certifications:'★',Resumes:'▤',Applications:'▣',Skills:'✦',Goals:'◎',Documents:'□',Settings:'⚙'};
let state={page:localStorage.chPage||'Dashboard',dark:localStorage.chDark==='1',certs:JSON.parse(localStorage.chCerts||'null')||[{id:1,name:'Professional Certification',issuer:'Certification Organization',expires:'2027-06-30',status:'Active'},{id:2,name:'Safety Certification',issuer:'Training Provider',expires:'2026-12-15',status:'Expiring'}],apps:JSON.parse(localStorage.chApps||'null')||[{id:1,company:'Example Company',role:'Operations Intern',status:'Interview'},{id:2,company:'Example Organization',role:'Business Assistant',status:'Applied'},{id:3,company:'Example Business',role:'Entry-Level Associate',status:'Saved'}]};
function save(){localStorage.chPage=state.page;localStorage.chDark=state.dark?'1':'0';localStorage.chCerts=JSON.stringify(state.certs);localStorage.chApps=JSON.stringify(state.apps);document.documentElement.dataset.theme=state.dark?'dark':'light'}
function go(p){state.page=p;save();render()}
function layout(body){return `<aside class="side"><div class="brand"><div class="logo">CH</div><div><b>Career Hub</b><small>Your career, organized.</small></div></div><nav>${NAV.map(n=>`<button class="nav ${state.page===n?'active':''}" onclick="go('${n}')">${icons[n]} &nbsp;${n}</button>`).join('')}</nav><div class="sideFoot">Personal career workspace</div></aside><main class="main"><header class="top"><button onclick="state.dark=!state.dark;save();render()">${state.dark?'☀ Light':'◐ Dark'}</button></header><section class="content">${body}</section></main><nav class="mobile">${NAV.slice(0,5).map(n=>`<button class="${state.page===n?'active':''}" onclick="go('${n}')">${icons[n]}<br>${n==='Dashboard'?'Home':n}</button>`).join('')}</nav>`}
function title(t,s,button=''){return `<div class="title"><div><span class="eyebrow">CAREER HUB</span><h1>${t}</h1><p>${s}</p></div>${button}</div>`}
function card(x,c=''){return `<section class="card ${c}">${x}</section>`}
function dashboard(){let active=state.certs.filter(x=>x.status==='Active').length;return title('Build what comes next.','Keep certifications, resumes, applications, skills, and goals in one organized place.',`<button class="btn" onclick="go('Certifications')">＋ Add something</button>`)+`<div class="stats">${[['★','Certifications',state.certs.length,'tracked credentials'],['▤','Resumes','2','saved versions'],['▣','Applications',state.apps.length,'tracked opportunities'],['◎','Career goals','3','in progress']].map(x=>card(`<div class="stat"><div class="ico">${x[0]}</div><div><p>${x[1]}</p><strong>${x[2]}</strong><small>${x[3]}</small></div></div>`)).join('')}</div><div class="two">${card(`<div class="cardHead"><div><h2>Certification status</h2><p>Keep your credentials current.</p></div><button class="link" onclick="go('Certifications')">View all ›</button></div><p>Active <b style="float:right">${active}</b></p><div class="bar"><i style="width:${state.certs.length?active/state.certs.length*100:0}%"></i></div><div style="margin-top:20px;padding:13px;border-radius:13px;background:var(--soft)"><b>Stay ahead of expirations</b><p>Review credentials before they need renewal.</p></div>`)}${card(`<div class="cardHead"><div><h2>Career progress</h2><p>Your workspace at a glance.</p></div></div>${['Build a strong resume','Track certifications','Prepare for interviews'].map((x,i)=>`<div class="row"><b style="color:var(--green)">✓</b><span class="grow">${x}</span><small>${i?'In progress':'Ready'}</small></div>`).join('')}`)}</div>${card(`<div class="cardHead"><div><h2>Recent applications</h2><p>Keep your job search moving.</p></div><button class="link" onclick="go('Applications')">Open tracker ›</button></div>${state.apps.slice(0,4).map(a=>`<div class="row"><div class="ico">▣</div><div class="grow"><b>${a.role}</b><span class="muted">${a.company}</span></div><span class="pill ${a.status.toLowerCase()}">${a.status}</span></div>`).join('')}`)}`}
function certifications(){return title('Certifications','Track every credential, renewal date, and supporting document.',`<button class="btn" onclick="openAdd()">＋ Add certification</button>`)+`<div class="toolbar"><input id="certSearch" class="search" placeholder="Search certifications..." oninput="filterCerts(this.value)"></div>${card('<div id="certList">'+certRows(state.certs)+'</div>')}`}
function certRows(list){return list.length?list.map(c=>`<div class="row"><div class="ico">★</div><div class="grow"><b>${c.name}</b><span class="muted">${c.issuer}</span></div><span class="muted">Expires ${c.expires}</span><span class="pill ${c.status.toLowerCase()}">${c.status}</span><button class="close" style="position:static;font-size:15px" onclick="removeCert(${c.id})">×</button></div>`).join(''):'<p>No certifications found.</p>'}
function filterCerts(q){document.getElementById('certList').innerHTML=certRows(state.certs.filter(c=>(c.name+' '+c.issuer).toLowerCase().includes(q.toLowerCase())))}
function resumes(){return title('Resumes','Create multiple versions tailored to different opportunities.',`<button class="btn" onclick="alert('Resume builder is the next module to connect.')">＋ New resume</button>`)+`<div class="grid">${['Professional','Modern','Simple'].map(x=>card(`<div class="resume">▤<br>${x}</div><h3>${x} Resume</h3><p>Saved resume template</p><br><button class="btn alt" onclick="alert('Resume editor placeholder')">Edit</button>`)).join('')}</div>`}
function applications(){return title('Job applications','Track opportunities from saved to offer.',`<button class="btn" onclick="addApp()">＋ Add application</button>`)+`<div class="kanban">${['Saved','Applied','Interview','Offer'].map(s=>card(`<h3>${s}</h3><p>${state.apps.filter(a=>a.status===s).length} opportunities</p>${state.apps.filter(a=>a.status===s).map(a=>`<div class="job"><b>${a.role}</b><span>${a.company}</span></div>`).join('')}`)).join('')}</div>`}
function simplePage(name,desc,items){return title(name,desc,`<button class="btn" onclick="alert('This module is ready for data integration.')">＋ Add</button>`)+`<div class="grid">${items.map(x=>card(`<div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><div class="bar" style="margin-top:15px"><i style="width:${x[3]}%"></i></div>`)).join('')}</div>`}
function page(){if(state.page==='Dashboard')return dashboard();if(state.page==='Certifications')return certifications();if(state.page==='Resumes')return resumes();if(state.page==='Applications')return applications();if(state.page==='Skills')return simplePage('Skills','Maintain a living inventory of what you know and what you are building.',[['✦','Leadership','Communication and team leadership',75],['✦','Communication','Written and verbal communication',82],['✦','Organization','Planning and task management',70],['✦','Technology','Digital tools and workflows',62],['✦','Problem Solving','Analysis and practical solutions',68],['✦','Teamwork','Collaborative project work',88]]);if(state.page==='Goals')return simplePage('Career goals','Turn long-term plans into manageable next steps.',[['◎','Build a professional resume','Complete a polished resume',100],['◎','Earn a new certification','Choose and complete a credential',55],['◎','Prepare for applications','Build an application-ready portfolio',45]]);if(state.page==='Documents')return simplePage('Documents','Keep resumes, certifications, cover letters, and other files organized.',[['□','Certifications','Credential files and records',60],['□','Resumes','Resume versions and exports',45],['□','Cover Letters','Reusable application letters',30],['□','Other','Miscellaneous career documents',20]]);return title('Settings','Manage your workspace preferences.')+card(`<div class="row"><div class="ico">CH</div><div class="grow"><h3>Career Profile</h3><p>Email and password account</p></div><button class="btn alt">Edit profile</button></div><div class="row"><div class="grow"><b>Appearance</b><p>Choose light or dark mode.</p></div><button class="btn alt" onclick="state.dark=!state.dark;save();render()">${state.dark?'Dark':'Light'} mode</button></div><div class="row"><div class="grow"><b>Cloud sync</b><p>Supabase can be connected when you are ready for real accounts and cloud storage.</p></div><span class="pill active">Ready</span></div>`)}
function render(){save();document.getElementById('app').innerHTML=layout(page())}
function openAdd(){document.getElementById('modal').innerHTML=`<div class="modalBg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button><h2>Add certification</h2><p>Save a certification directly in this browser.</p><label>Name</label><input id="n" placeholder="Certification name"><label>Issuer</label><input id="i" placeholder="Issuing organization"><label>Expiration</label><input id="e" type="date"><button class="btn" style="width:100%" onclick="saveCert()">Create certification</button></div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function saveCert(){let n=document.getElementById('n').value.trim()||'New Certification',i=document.getElementById('i').value.trim()||'Issuing Organization',e=document.getElementById('e').value||'2027-01-01';state.certs.push({id:Date.now(),name:n,issuer:i,expires:e,status:'Active'});closeModal();save();render()}
function removeCert(id){state.certs=state.certs.filter(x=>x.id!==id);save();render()}
function addApp(){state.apps.push({id:Date.now(),company:'New Company',role:'New Opportunity',status:'Saved'});save();render()}
render();
</script></body></html>
